<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brodstar Planetarium | Fantasy Football LIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <small>FANTASY FOOTBALL • LIVE Q&A</small>
  <h1>BRODSTAR<br>PLANETARIUM</h1>
  <p>Submit your question or roster for a LIVE review.</p>
<div class="brodstar-characters">
  <img src="image0%20(15).png" alt="Brodstar" class="brodstar-photo">
  <img src="just%20skell.png" alt="Skeleton mascot" class="brodstar-skeleton">
</div>
</header>

<main>
 <div class="tabs">
  <button id="qtab" class="active" type="button">
    Rate My Matchup
  </button>
  <button id="rtab" type="button">
    Rate My Team
  </button>
  <button id="stab" type="button">
    Start / Sit
  </button>
  <button id="ttab" type="button">
    Trade Advice
  </button>
</div>

  <form id="form" class="panel" novalidate>
<h2 id="formtitle">Rate My Fantasy Football Matchup</h2>

    <div class="grid">
      <div>
        <label for="username">TikTok username *</label>
        <input id="username" maxlength="60" required
               placeholder="@yourhandle">
      </div>

      <div>
        <label for="league">Scoring format</label>
        <select id="league">
          <option>PPR</option>
          <option>Half PPR</option>
          <option>Standard</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <div id="questionFields">
      <label for="question">Your question *</label>
      <textarea id="question" maxlength="1500"
        placeholder="Start/sit, trades, waiver wire..."></textarea>
    </div>

    <div id="startSitFields" class="hidden">
  <label for="startSitPlayers">Players you're deciding between</label>
  <textarea
    id="startSitPlayers"
    rows="6"
    placeholder="Enter one player per line. You can enter 2 or more players."
  ></textarea>
</div>

<div id="tradeFields" class="hidden">
  <label for="tradeGive">Players you are trading away</label>
  <textarea
    id="tradeGive"
    rows="4"
    placeholder="Enter one player per line"
  ></textarea>

  <label for="tradeReceive">Players you are receiving</label>
  <textarea
    id="tradeReceive"
    rows="4"
    placeholder="Enter one player per line"
  ></textarea>
</div>
    <div id="rosterFields" class="hidden">
      <div>
  <label for="leagueSize">League Size *</label>
  <select id="leagueSize">
    <option value="">Select your league size</option>
    <option value="6">6-Team League</option>
    <option value="8">8-Team League</option>
    <option value="10">10-Team League</option>
    <option value="12">12-Team League</option>
    <option value="14">14-Team League</option>
  </select>
</div>
      <div class="grid">
        <div>
          <label for="qb">Quarterbacks</label>
          <textarea id="qb" placeholder="One player per line"></textarea>
        </div>
        <div>
          <label for="rb">Running Backs</label>
          <textarea id="rb" placeholder="One player per line"></textarea>
        </div>
        <div>
          <label for="wr">Wide Receivers</label>
          <textarea id="wr" placeholder="One player per line"></textarea>
        </div>
        <div>
          <label for="te">Tight Ends</label>
          <textarea id="te" placeholder="One player per line"></textarea>
        </div>
        <div>
          <label for="flex">FLEX / Starters</label>
          <textarea id="flex" placeholder="One player per line"></textarea>
        </div>
        <div>
          <label for="bench">Bench</label>
          <textarea id="bench" placeholder="One player per line"></textarea>
        </div>
      </div>

      <label for="rosterQuestion">What would you like reviewed?</label>
      <textarea id="rosterQuestion" maxlength="1500"
        placeholder="Who should I start? What should I trade?"></textarea>
    </div>

    <p class="muted">
      Viewer submissions may be shown during TikTok LIVE.
    </p>

    <button id="submit" type="submit">
      Send to LIVE Queue
    </button>

    <p id="message" class="status" role="status"></p>
  </form>

  <p class="footer">Brodstar Planetarium • Fantasy Football LIVE</p>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="common.js"></script>
<script src="viewer.js?v=3"></script>

</body>
</html>
