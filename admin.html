
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brodstar Planetarium | LIVE Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{background:#171e35;padding:24px;border-bottom:4px solid #ffda4a}
h1{margin:8px 0}
main{max-width:1000px;margin:auto;padding:24px}
.card{background:#1b243d;border:1px solid #39445f;border-radius:14px;padding:20px;margin:16px 0}
button{background:#ffda4a;color:#101526;border:0;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer}
input{padding:12px;width:100%;margin:8px 0;background:#101526;color:white;border:1px solid #59647e;border-radius:8px}
small{color:#aab5cd}
.status{color:#ffda4a}
</style>
</head>
<body>
<header>
<small>FANTASY FOOTBALL • LIVE Q&A</small>
<h1>BRODSTAR PLANETARIUM</h1>
<p>Host Dashboard — Question Queue</p>
</header>
<main>
<div class="card">
<h2>Connect your queue</h2>
<p>Enter your Supabase project URL and publishable key.</p>
<input id="url" placeholder="https://yourproject.supabase.co">
<input id="key" placeholder="sb_publishable_...">
<button onclick="loadQuestions()">Load questions</button>
<p id="message" class="status"></p>
</div>
<h2>Viewer Submissions</h2>
<div id="questions">No questions loaded yet.</div>
</main>
<script>
async function loadQuestions(){
 const url=document.getElementById('url').value.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
 const key=document.getElementById('key').value.trim();
 const message=document.getElementById('message');
 const container=document.getElementById('questions');
 if(!url.startsWith('https://')||!key){
  message.textContent='Enter your project URL and publishable key.';
  return;
 }
 message.textContent='Loading...';
 try{
  const response=await fetch(url+'/rest/v1/questions?select=*&order=id.desc&limit=50',{
   headers:{apikey:key,Authorization:'Bearer '+key}
  });
  if(!response.ok)throw Error('Request failed ('+response.status+').');
  const data=await response.json();
  container.replaceChildren();
  if(!data.length)container.textContent='No visible questions yet.';
  for(const q of data){
   const card=document.createElement('div');
   card.className='card';
   const title=document.createElement('h3');
   title.textContent=q.username||'Anonymous viewer';
   const type=document.createElement('p');
   type.textContent='Type: '+(q.question_type||'General');
   const question=document.createElement('p');
   question.textContent=q.question||'No question text';
   const roster=document.createElement('p');
   roster.textContent='Roster: '+JSON.stringify(q.roster||{});
   card.append(title,type,question,roster);
   container.append(card);
  }
  message.textContent=data.length+' questions loaded.';
 }catch(err){
  message.textContent=err.message+' Private questions may require host authentication.';
 }
}
</script>
</body>
</html>
