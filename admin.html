<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brodstar Planetarium | Host Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{background:#191f36;padding:30px 6%;border-bottom:5px solid #ffdc62}
h1{font-size:clamp(28px,5vw,48px);margin:10px 0}
main{max-width:1000px;margin:35px auto;padding:0 20px}
.card{background:#1d253d;border:1px solid #404b68;border-radius:16px;padding:25px;margin-bottom:25px}
input,button{font:inherit;padding:13px;border-radius:9px}
input{display:block;width:100%;margin:12px 0;background:#101629;color:white;border:1px solid #65708c}
button{background:#ffdc62;color:#11172a;border:0;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}
button:disabled{opacity:.5}
.danger{background:#ff7070}
.question{background:#11182d;border:1px solid #465372;padding:18px;border-radius:12px;margin:12px 0}
small{color:#b8c2da}
#status{color:#ffdc62}
</style>
</head>
<body>
<header>
<small>FANTASY FOOTBALL • LIVE Q&A</small>
<h1>BRODSTAR PLANETARIUM</h1>
<p>Host Dashboard —  Queue</p>
</header>
<main>
<section class="card" id="setup">
<h2>Connect Supabase</h2>
<input id="url" placeholder="https://yourproject.supabase.co">
<input id="key" placeholder="sb_publishable_...">
<button onclick="connect()">Connect</button>
</section>

<section class="card" id="login" hidden>
<h2>Host Login</h2>
<input id="email" type="email" placeholder="Host email">
<input id="password" type="password" placeholder="Password">
<button onclick="signIn()">Sign In</button>
</section>

<section class="card" id="dashboard" hidden>
<h2>Viewer Submissions</h2>
<p id="count">Loading questions...</p>
<button onclick="loadQuestions()">Refresh Questions</button>
<button class="danger" onclick="signOut()">Sign Out</button>
<div id="questions"></div>
</section>
<p id="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let db;
const HOST_ID='acb6bb48-8e4d-477b-9901-f556a6d305be';
const el=id=>document.getElementById(id);
const status=msg=>el('status').textContent=msg;

async function connect(){
 try{
  const url=el('url').value.trim().replace(/\/+$/,'');
  const key=el('key').value.trim();
  if(!/^https:\/\/[^/]+\.supabase\.co$/.test(url)||!key.startsWith('sb_publishable_')){
   throw Error('Check your project URL and publishable key.');
  }
  db=window.supabase.createClient(url,key);
  sessionStorage.setItem('bp_url',url);
  sessionStorage.setItem('bp_key',key);
  el('setup').hidden=true;
  el('login').hidden=false;
  const {data,error}=await db.auth.getUser();
  if(!error&&data.user)await showDashboard(data.user);
  else status('Connected. Sign in with your host account.');
 }catch(e){status(e.message)}
}

async function signIn(){
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:el('email').value.trim(),
   password:el('password').value
  });
  if(error)throw error;
  if(data.user.id!==HOST_ID){
   await db.auth.signOut();
   throw Error('This account is not authorized as host.');
  }
  el('password').value='';
  await showDashboard(data.user);
 }catch(e){status(e.message)}
}

async function showDashboard(user){
 if(user.id!==HOST_ID){
  await db.auth.signOut();
  status('Host account required.');
  return;
 }
 el('login').hidden=true;
 el('dashboard').hidden=false;
 await loadQuestions();
}

async function loadQuestions(){
 if(!db)return;
 status('Loading...');
 const {data,error}=await db.from('questions').select('*').order('id',{ascending:false}).limit(50);
 if(error){
  status('Unable to load questions: '+error.message);
  return;
 }
 const container=el('questions');
 container.replaceChildren();
 el('count').textContent=data.length+' question(s) loaded';
 if(!data.length){
  container.textContent='No questions submitted yet.';
 }
 for(const q of data){
  const card=document.createElement('div');
  card.className='question';
  const heading=document.createElement('h3');
  heading.textContent=q.username||q.viewer_name||q.name||'Viewer';
  const body=document.createElement('p');
  body.textContent=q.question||q.question_text||q.content||'';
  const pickMatch = (q.question || "").match(/START\s*\/\s*SIT\s*[—–-]\s*PICK\s*([123])/i);

if (pickMatch) {
  const pickLabel = document.createElement("div");
  pickLabel.textContent = "PICK " + pickMatch[1] + " PLAYERS";
  pickLabel.style.color = "#ffcc00";
  pickLabel.style.fontSize = "22px";
  pickLabel.style.fontWeight = "900";
  pickLabel.style.marginBottom = "8px";
  card.appendChild(pickLabel);
}
  card.append(heading, body);
  const submittedTime = document.createElement('p');
submittedTime.style.color = '#ffcc00';
submittedTime.style.fontSize = '12px';
submittedTime.style.margin = '5px 0';

if (q.created_at) {
  submittedTime.textContent = 'Submitted: ' +
    new Date(q.created_at).toLocaleString('en-US', {
      month: 'short',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit'
    });
  card.append(submittedTime);
}
  const roster = q.roster;
if (q.league_size || q.league_format) {  const leagueSizeLabel = document.createElement('p');
leagueSizeLabel.textContent = `🏈 ${q.league_size ? q.league_size + '-Team League' : ''}${q.league_format ? ' • ' + q.league_format : ''}`;  leagueSizeLabel.style.color = '#ffcc00';
  leagueSizeLabel.style.fontWeight = 'bold';
  card.append(leagueSizeLabel);
}

if (roster && typeof roster === "object") {
  const rosterBox = document.createElement("div");

  rosterBox.style.display = "grid";
  rosterBox.style.gridTemplateColumns =
    "repeat(auto-fit, minmax(180px, 1fr))";
  rosterBox.style.gap = "12px";
  rosterBox.style.marginTop = "16px";

  ["QB", "RB", "WR", "TE", "FLEX", "BENCH"].forEach(pos => {
    const players = roster[pos];

    if (!players) return;

    const positionCard = document.createElement("div");

    positionCard.style.background = "#202c43";
    positionCard.style.padding = "14px";
    positionCard.style.borderRadius = "10px";
    positionCard.style.whiteSpace = "pre-line";

    const label = document.createElement("strong");
    label.textContent = pos;
    label.style.color = "#ffd447";

    const names = document.createElement("p");
    names.textContent = players;
    names.style.marginBottom = "0";

    positionCard.append(label, names);
    rosterBox.append(positionCard);
  });

  card.append(rosterBox);
}
  const featureButton = document.createElement('button');
featureButton.textContent = '⭐ FEATURE ON LIVE';
featureButton.style.marginTop = '15px';
featureButton.style.background = '#ffcc00';
featureButton.style.color = '#111827';

featureButton.onclick = function () {
  const featured = { ...q };

  if (q.question_type === "Start/Sit") {
    const selected = Array.from(
      card.querySelectorAll('input[type="checkbox"]:checked')
    ).map(box => box.value);

    featured.selected_starters = selected;
  }

  localStorage.setItem(
    'featuredSubmission',
    JSON.stringify(featured)
  );

  window.open('live.html', 'brodstarLive');
};

card.append(featureButton);
  const statusRow = document.createElement('div');
statusRow.style.display = 'flex';
statusRow.style.flexWrap = 'wrap';
statusRow.style.gap = '8px';
statusRow.style.marginTop = '10px';

const statusLabel = document.createElement('p');
statusLabel.style.fontWeight = 'bold';
statusLabel.style.color = '#ffcc00';
statusLabel.textContent = 'Status: ' + ({
  waiting: 'Pending',
  on_stream: 'Accepted',
  answered: 'Answered ✓',
  skipped: 'Declined'
}[q.status] || 'Pending');

card.append(statusLabel);

async function changeStatus(newStatus) {
  const { error } = await db
    .from('questions')
    .update({ status: newStatus })
    .eq('id', q.id);

  if (error) {
    alert('Unable to update status: ' + error.message);
    return;
  }
if (newStatus === 'on_stream' && q.question_type === 'Start/Sit') {
  const selected = Array.from(
    startSitBox.querySelectorAll('input[type="checkbox"]:checked')
  ).map(box => box.value);

  const featured = { ...q, selected_starters: selected };

  localStorage.setItem(
    'featuredSubmission',
    JSON.stringify(featured)
  );
}
 if (newStatus === 'on_stream' || newStatus === 'skipped') {
  localStorage.setItem('brodstarBroadcast', JSON.stringify({
    id: Date.now(),
    title: newStatus === 'on_stream' ? 'SUBMISSION ACCEPTED' : 'SUBMISSION DECLINED',
    username: q.username || q.viewer_name || 'Viewer'
  }));
}
 if ((newStatus === 'on_stream' && q.question_type !== 'Start/Sit') || newStatus === 'skipped') {
  setTimeout(async () => {
    const { data: nextQuestions, error: nextError } = await db
      .from('questions')
      .select('*')
.or('status.eq.waiting,status.is.null')
.gt('id', q.id)
.order('id', { ascending: true })
.limit(1);


    if (nextError) {
      console.error('Unable to load next question:', nextError);
      return;
    }

    if (nextQuestions && nextQuestions.length > 0) {
      localStorage.setItem(
        'featuredSubmission',
        JSON.stringify(nextQuestions[0])
      );
    }
  }, 8500);
}
  await loadQuestions();
}

[
  ['✓ Accept', 'on_stream', '#198754'],
  ['✕ Decline', 'skipped', '#dc3545'],
  ['✓ Mark Answered', 'answered', '#555e70']
].forEach(([text, value, color]) => {
  const button = document.createElement('button');
  button.textContent = text;
  button.style.background = color;
  button.style.color = 'white';
  button.style.padding = '9px 12px';
  button.style.border = 'none';
  button.style.borderRadius = '8px';
  button.style.cursor = 'pointer';

  button.onclick = () => changeStatus(value);
  statusRow.append(button);
});

if (q.question_type === "Start/Sit") {
  const startSitBox = document.createElement("div");
  startSitBox.style.marginTop = "12px";
  startSitBox.style.padding = "12px";
  startSitBox.style.background = "#202c43";
  startSitBox.style.borderRadius = "10px";

  const heading = document.createElement("strong");
  heading.textContent = "SELECT YOUR START(S)";
  heading.style.color = "#ffdd44";
  startSitBox.append(heading);

  const playerText = (q.question || "")
    .replace(/^START\s*\/\s*SIT:\s*/i, "");

  const players = playerText
    .split(/\s+vs\s+|,/i)
    .map(name => name.trim())
    .filter(Boolean);

  players.forEach(player => {
    const label = document.createElement("label");
    label.style.display = "block";
    label.style.marginTop = "8px";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = player;
    checkbox.style.marginRight = "8px";

    label.append(checkbox, document.createTextNode(player));
    startSitBox.append(label);
  });

  card.append(startSitBox);
}
  card.append(statusRow);
  container.append(card);
 }
 status('Questions loaded successfully.');
}

async function signOut(){
 if(db)await db.auth.signOut();
 el('dashboard').hidden=true;
 el('login').hidden=false;
 status('Signed out.');
}

window.addEventListener('DOMContentLoaded',()=>{
 const url=sessionStorage.getItem('bp_url');
 const key=sessionStorage.getItem('bp_key');
 if(url&&key){
  el('url').value=url;
  el('key').value=key;
  connect();
 }
});
</script>
</body>
</html>
