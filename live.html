<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brodstar Planetarium | LIVE Display</title>
<style>
*{box-sizing:border-box}
:root{--yellow:#ffdc57;--red:#fa435b;--white:#fff;--muted:#aab7d1}
html,body{margin:0;min-height:100%;background:#080e1c;color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
header{padding:12px 16px 10px;text-align:center;background:#151f34;border-bottom:3px solid var(--yellow)}
header h1{margin:0;font-size:clamp(16px,3vw,32px);letter-spacing:1px;font-weight:900}
header p{margin:4px 0 0;color:var(--yellow);font-weight:800;font-size:clamp(10px,1.5vw,15px);letter-spacing:1px}
.banner{background:var(--red);padding:12px 8px;text-align:center;font-size:clamp(18px,3vw,32px);font-weight:900;line-height:1.15;border-bottom:3px solid var(--yellow)}
.stage{display:grid;grid-template-columns:minmax(0,36%) minmax(0,64%);gap:10px;padding:12px;min-height:310px;align-items:start}
.comment-space{min-height:290px;display:flex;align-items:flex-start;justify-content:center;padding-top:18px}
.comment-space span{font-size:11px;color:#536078;letter-spacing:1px;text-align:center;opacity:.45}
.card{min-width:0;background:#172238;border:1px solid #40516d;border-radius:15px;padding:15px;box-shadow:0 8px 28px #0004}
.label{color:var(--yellow);font-weight:900;font-size:clamp(11px,1.5vw,17px);letter-spacing:.6px}
#username{font-size:clamp(20px,3vw,35px);margin:6px 0 8px;overflow-wrap:anywhere;line-height:1.1}
#question{font-size:clamp(16px,2.15vw,25px);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:700;margin-bottom:10px}
#leagueSize{display:none;color:var(--yellow);font-weight:800;font-size:clamp(11px,1.5vw,16px);margin:8px 0}
#roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.position{background:#0d1527;border-left:4px solid var(--yellow);border-radius:8px;padding:9px 10px;min-width:0}
.position strong{display:block;color:var(--yellow);font-size:clamp(12px,1.5vw,17px);margin-bottom:5px}
.position p{margin:0;font-size:clamp(14px,1.8vw,21px);line-height:1.2;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
footer{text-align:center;color:var(--yellow);font-weight:800;font-size:11px;letter-spacing:.7px;padding:8px 12px 12px}
@media(max-width:600px){header{padding:8px 8px 7px}.banner{padding:9px 5px}.stage{grid-template-columns:minmax(0,33%) minmax(0,67%);gap:5px;padding:6px;min-height:260px}.comment-space{min-height:260px}.comment-space span{display:none}.card{padding:9px;border-radius:10px}#username{font-size:clamp(17px,4.2vw,25px)}#question{font-size:clamp(14px,3.2vw,19px)}#roster{gap:5px}.position{padding:6px;border-left-width:3px}.position strong{font-size:11px}.position p{font-size:clamp(12px,2.8vw,17px)}footer{font-size:9px}}
/* Compact LIVE featured section */
.card {
  padding: 10px;
}

.label {
  margin: 0 0 3px;
}

#username {
  margin: 2px 0 4px;
}

#question {
  margin-bottom: 5px;
}

#leagueSize {
  margin: 3px 0 5px;
}

#roster {
  gap: 4px;
}

.position {
  padding: 5px 8px;
}

.position strong {
  margin-bottom: 2px;
}

.position p {
  margin: 0;
  line-height: 1.1;
}
  /* 1990s NFL broadcast notification */
#broadcastAlert {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 14%;
  transform: translateX(-50%);
  width: min(88%, 650px);
  z-index: 9999;
  padding: 5px;
  background: linear-gradient(135deg, #ffffff, #707b91, #ffffff);
  border: 3px solid #ffcc00;
  box-shadow: 0 0 30px #ffcc0088, 0 12px 35px #000a;
  text-align: center;
  pointer-events: none;
}

#broadcastAlert.show {
  display: block;
  animation: nflSlam 0.5s ease-out both;
}

#broadcastAlert.hide {
  animation: nflExit 0.4s ease-in both;
}

#broadcastInner {
  background: linear-gradient(135deg, #081a3c, #263f70, #081a3c);
  padding: 16px 10px;
  border: 2px solid #ffffff;
}

#broadcastTitle {
  font-size: clamp(22px, 4vw, 46px);
  font-weight: 900;
  font-style: italic;
  color: #ffdc57;
  text-shadow: 3px 3px #000, 0 0 12px #ffdc57;
}

#broadcastName {
  color: white;
  font-size: clamp(16px, 2.5vw, 28px);
  font-weight: 900;
  margin-top: 5px;
  overflow-wrap: anywhere;
}

@keyframes nflSlam {
  from {
    opacity: 0;
    transform: translate(-50%, 100px) scale(1.3);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
}

@keyframes nflExit {
  to {
    opacity: 0;
    transform: translate(-50%, -60px) scale(0.8);
  }
}

  @keyframes skeletonBounce {
  from { transform: translateY(0) rotate(-5deg); }
  to { transform: translateY(-15px) rotate(5deg); }
}
</style>
</head>
<body>
  <div id="broadcastAlert">
  <div id="broadcastInner">
    <div id="broadcastTitle">SUBMISSION ACCEPTED</div>
    <div id="broadcastName"></div>
    <img src="just%20skell.png" id="broadcastSkeleton" alt="Brodstar Skeleton" style="display:block;width:130px;max-height:170px;object-fit:contain;margin:10px auto 0;animation:skeletonBounce 0.7s ease-in-out infinite alternate;">
  </div>
</div>
<header><h1>BRODSTAR PLANETARIUM</h1><p>FANTASY FOOTBALL • LIVE REVIEW</p></header>
<div class="banner">Gifts &amp; Follows Appreciated!</div>
<main class="stage">
  <div class="comment-space" aria-hidden="true"><span>TIKTOK COMMENTS AREA</span></div>
  <section class="card" aria-label="Featured live submission">
    <div class="label">NOW FEATURING</div>
    <h2 id="username">Waiting for a viewer...</h2>
    <div id="question">Select a submission from your host dashboard.</div>
    <div id="leagueSize"></div>
    <div id="roster"></div>
  </section>
</main>
<footer>THE PLANETARIUM • LIVE Q&amp;A</footer>
<script>
function displaySubmission(q) {
  if (!q || typeof q !== 'object') return;
  const name = String(q.username || q.viewer_name || 'Viewer').replace(/^@+/, '');
  document.getElementById('username').textContent = '@' + name;
  document.getElementById('question').textContent = q.question || q.question_text || q.content || '';
  const leagueSizeLabel = document.getElementById('leagueSize');
leagueSizeLabel.textContent = [q.league_size ? `${q.league_size}-TEAM LEAGUE` : '', q.league_format || ''].filter(Boolean).join(' • ');  leagueSizeLabel.style.display = (q.league_size || q.league_format) ? 'block' : 'none';
  const oldResults = document.getElementById("startSitResults");
if (oldResults) oldResults.remove();

if (q.question_type === "Start/Sit" && Array.isArray(q.selected_starters)) {
  const results = document.createElement("div");
  results.id = "startSitResults";
  results.style.marginTop = "10px";
  results.style.fontSize = "20px";
  results.style.fontWeight = "bold";

  const players = (q.question || "")
 .replace(/^START\s*\/\s*SIT\s*(?:—|-)?\s*(?:PICK\s*\d+)?\s*:\s*/i, "")
    .split(/\s+vs\s+/i)
    .map(name => name.trim())
    .filter(Boolean);

  players.forEach(player => {
    const line = document.createElement("div");
    line.style.marginBottom = "6px";

    const isStarter = q.selected_starters.includes(player);

    line.style.color = isStarter ? "#4ade80" : "#ff6b6b";
    line.textContent = (isStarter ? "✓ START: " : "✕ SIT: ") + player;

    results.appendChild(line);
  });

  document.getElementById("question").after(results);
}

  const rosterBox = document.getElementById('roster');
  rosterBox.replaceChildren();
  let roster = q.roster;
  if (typeof roster === 'string') {
    try { roster = JSON.parse(roster); }
    catch (e) { roster = null; }
  }
  if (roster && typeof roster === 'object' && !Array.isArray(roster)) {
    ['QB','RB','WR','TE','FLEX','BENCH'].forEach(pos => {
      if (!roster[pos]) return;
      const card = document.createElement('div');
      card.className = 'position';
      const label = document.createElement('strong');
      label.textContent = pos;
      const names = document.createElement('p');
      names.textContent = String(roster[pos]);
      card.append(label,names);
      rosterBox.append(card);
    });
  }
  if ((q.question_type || "").toLowerCase().includes("trade")) {
  const tradeText = q.question || "";

  const away = tradeText.match(
    /TRADE AWAY:\s*([\s\S]*?)(?=RECEIVE:|$)/i
  );
  const receive = tradeText.match(
    /RECEIVE:\s*([\s\S]*)/i
  );

  if (away && receive) {
    const tradeGrid = document.createElement("div");
    tradeGrid.style.display = "grid";
    tradeGrid.style.gridTemplateColumns = "repeat(2, minmax(0, 1fr))";
    tradeGrid.style.gap = "8px";

    function tradeCard(title, players) {
      const card = document.createElement("div");
      card.style.background = "#0d1527";
      card.style.border = "1px solid #ffdc57";
      card.style.borderRadius = "8px";
      card.style.padding = "10px";
      card.style.minWidth = "0";

      const heading = document.createElement("div");
      heading.textContent = title;
      heading.style.color = "#ffdc57";
      heading.style.fontWeight = "900";
      heading.style.marginBottom = "8px";
      card.appendChild(heading);

      players.split(/,|\n/).forEach(player => {
        if (!player.trim()) return;
        const row = document.createElement("div");
        row.textContent = player.trim();
        row.style.marginBottom = "5px";
        row.style.overflowWrap = "anywhere";
        card.appendChild(row);
      });

      tradeGrid.appendChild(card);
    }

    tradeCard("TRADE AWAY", away[1]);
    tradeCard("RECEIVE", receive[1]);

    rosterBox.appendChild(tradeGrid);
    rosterBox.style.display = "block";

    document.getElementById("question").textContent = "TRADE ADVICE";
  }
}

  if (q.question_type === "Rate My Matchup") {
  const questionBox = document.getElementById("question");
  const text = q.question || "";

  const myMatch = text.match(/MY STARTING LINEUP:\s*([\s\S]*?)(?=OPPONENT'?S STARTING LINEUP:|$)/i);
 const oppMatch = text.match(/OPPONENT'?S STARTING LINEUP:\s*([\s\S]*?)(?=MATCHUP NOTES:|$)/i);

  if (myMatch && oppMatch) {
    questionBox.textContent = "RATE MY MATCHUP";

    const matchup = document.createElement("div");
    matchup.style.display = "grid";
    matchup.style.gridTemplateColumns = "repeat(2, minmax(0, 1fr))";
    matchup.style.gap = "8px";
    matchup.style.marginTop = "10px";

    function addLineup(title, raw) {
      const card = document.createElement("div");
      card.style.background = "#0d1527";
      card.style.border = "1px solid #ffdc57";
      card.style.borderRadius = "8px";
      card.style.padding = "8px";
      card.style.minWidth = "0";

      const heading = document.createElement("div");
      heading.textContent = title;
      heading.style.color = "#ffdc57";
      heading.style.fontWeight = "900";
      heading.style.marginBottom = "8px";
      card.appendChild(heading);

     raw.trim().split(/(?=\b(?:QB|RB|WR|TE|FLEX|K|DEF)\d*:\s*)/i).forEach(line => {
        if (!line.trim()) return;

       const row = document.createElement("div");
        row.textContent = line.trim();
        card.appendChild(row);
      });

      matchup.appendChild(card);
    }

    addLineup("MY LINEUP", myMatch[1]);
    addLineup("OPPONENT", oppMatch[1]);

    rosterBox.appendChild(matchup);
    rosterBox.style.display = "block";
  } else {
    questionBox.textContent = text;
  }
} else {
  rosterBox.style.display = "";
}
}
  function refreshFeatured() {
  try {
    const saved = localStorage.getItem('featuredSubmission');
    if (saved) displaySubmission(JSON.parse(saved));
  } catch (e) {
    console.error('Unable to display submission:',e);
  }
}

  let lastBroadcastId = null;

function showBroadcastAlert(data) {
  const accepted = data.title === 'SUBMISSION ACCEPTED';

document.getElementById('broadcastInner').style.background =
  accepted ? '#176B39' : '#A71F2B';
  const alertBox = document.getElementById('broadcastAlert');
  const title = document.getElementById('broadcastTitle');
  const name = document.getElementById('broadcastName');

  if (!alertBox || !data) return;

  title.textContent = data.title || 'SUBMISSION UPDATE';
  name.textContent = data.username || '';

  alertBox.classList.remove('show', 'hide');
  void alertBox.offsetWidth;
  alertBox.classList.add('show');

  setTimeout(() => {
    alertBox.classList.remove('show');
    alertBox.classList.add('hide');
  }, 3500);
}
window.addEventListener('storage', (event) => {
  if (event.key !== 'brodstarBroadcast' || !event.newValue) return;

  try {
    const data = JSON.parse(event.newValue);
    if (data.id === lastBroadcastId) return;
    lastBroadcastId = data.id;
    showBroadcastAlert(data);
  } catch (error) {
    console.error('Broadcast notification error:', error);
  }
});

  refreshFeatured();
window.addEventListener('storage',refreshFeatured);
</script>
</body>
</html>
