<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brodstar Planetarium | LIVE Display</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080e1c;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #151f34;
  border-bottom: 5px solid #ffcc00;
  padding: 24px;
  text-align: center;
}
header h1 {
  margin: 0;
  font-size: clamp(28px, 5vw, 54px);
}
header p { color: #ffcc00; font-weight: bold; }
main {
  max-width: 1100px;
  margin: 35px auto;
  padding: 20px;
}
.card {
  background: #172238;
  border: 2px solid #384861;
  border-radius: 22px;
  padding: 30px;
}
.label {
  color: #ffcc00;
  font-size: 20px;
  font-weight: bold;
}
#username {
  font-size: clamp(26px, 4vw, 42px);
  margin: 15px 0;
}
#question {
  font-size: clamp(24px, 3.5vw, 40px);
  line-height: 1.4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
#roster {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-top: 25px;
}
.position {
  background: #0d1527;
  padding: 20px;
  border-radius: 14px;
  border-left: 5px solid #ffcc00;
}
.position strong {
  color: #ffcc00;
  font-size: 22px;
}
.position p {
  font-size: 24px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
footer {
  text-align: center;
  color: #ffcc00;
  padding: 30px;
}
</style>
</head>
<body>
<header>
  <h1>BRODSTAR PLANETARIUM</h1>
  <p>FANTASY FOOTBALL • LIVE REVIEW</p>
</header>

<main>
  <div class="card">
    <div class="label">NOW FEATURING</div>
    <h2 id="username">Waiting for a viewer...</h2>
    <div id="question">Select a submission from your host dashboard.</div>
    <div id="roster"></div>
  </div>
</main>

<footer>THE PLANETARIUM • LIVE Q&A</footer>

<script>
function displaySubmission(q) {
  document.getElementById('username').textContent =
    '@' + (q.username || q.viewer_name || 'Viewer');

  document.getElementById('question').textContent =
    q.question || q.question_text || q.content || '';

  const rosterBox = document.getElementById('roster');
  rosterBox.replaceChildren();

  let roster = q.roster;
  if (typeof roster === 'string') {
    try { roster = JSON.parse(roster); }
    catch (e) { roster = null; }
  }

  if (roster && typeof roster === 'object') {
    ['QB', 'RB', 'WR', 'TE', 'FLEX', 'BENCH'].forEach(pos => {
      if (!roster[pos]) return;

      const card = document.createElement('div');
      card.className = 'position';

      const label = document.createElement('strong');
      label.textContent = pos;

      const names = document.createElement('p');
      names.textContent = roster[pos];

      card.append(label, names);
      rosterBox.append(card);
    });
  }
}

function refreshFeatured() {
  try {
    const saved = localStorage.getItem('featuredSubmission');
    if (saved) displaySubmission(JSON.parse(saved));
  } catch (e) {
    console.error('Unable to display submission:', e);
  }
}

refreshFeatured();
window.addEventListener('storage', refreshFeatured);
</script>
</body>
</html>
